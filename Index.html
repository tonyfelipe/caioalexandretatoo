<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 🎯 SEO Local Otimizado para o Google encontrar o Caio -->
    <title>Caio Alexandre Tattoo | Estúdio Privado São Paulo</title>
    <meta name="description" content="Tatuagens artísticas e exclusivas com Caio Alexandre Tattoo. Atendimento privado com hora marcada na Rua Leopoldo de Passos Lima, 911 - Sala 3. Agende seu horário!">
    <meta name="keywords" content="Caio Alexandre Tattoo, Caio Art Tattoo, Tatuagem Sao Paulo, Studio de Tattoo Sala 3, Blackwork, Fineline, Tatuador Leopoldo de Passos Lima">
    <meta name="robots" content="index, follow">

    <!-- Meta Tags para Compartilhamento (WhatsApp e Redes Sociais) -->
    <meta property="og:title" content="Caio Alexandre Tattoo | Estúdio Privado">
    <meta property="og:description" content="Traços finos, realismo e artes exclusivas no estúdio privado em São Paulo. Solicite seu orçamento online.">
    <meta property="og:type" content="website">

    <!-- FontAwesome para Ícones Leves -->
    <link rel="stylesheet" href="https://cloudflare.com">

    <!-- 🎨 ESTILOS VISUAIS (CSS INTEGRADO) -->
    <style>
        :root {
            --bg-pure-dark: #090a0c;
            --bg-card-dark: #121418;
            --bg-input-dark: #1a1d24;
            --accent-silver: #e2e8f0;
            --accent-gold: #cca43b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #22252a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-pure-dark);
            color: var(--text-main);
            padding-bottom: 40px;
        }

        /* ⚓ HEADER & REPRODUÇÃO DO BRASÃO DA FOTO */
        .main-header {
            background-color: rgba(9, 10, 12, 0.95);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-ancora {
            width: 45px;
            height: 45px;
            border: 2px dashed var(--accent-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-ancora i {
            color: var(--accent-silver);
            font-size: 1.2rem;
        }

        .logo-text h1 {
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            line-height: 1;
        }

        .logo-text span {
            font-size: 0.65rem;
            color: var(--accent-gold);
            letter-spacing: 3px;
            font-weight: 700;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            margin: 0 12px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--text-main);
        }

        .btn-insta {
            background-color: #121418;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .btn-insta:hover {
            border-color: var(--accent-gold);
        }

        .btn-admin {
            background: transparent;
            color: var(--text-muted);
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            margin-left: 10px;
        }

        /* 📦 LAYOUT CONTAINERS */
        .section-container {
            max-width: 950px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 25px;
            color: var(--accent-silver);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 📺 VÍDEO LIVE YOUTUBE */
        .video-responsive {
            overflow: hidden;
            padding-bottom: 56.25%;
            position: relative;
            height: 0;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .video-responsive iframe {
            left: 0;
            top: 0;
            height: 100%;
            width: 100%;
            position: absolute;
        }

        .live-icon {
            color: #ef4444;
            animation: flash 1.8s infinite;
        }

        @keyframes flash { 50% { opacity: 0.4; } }

        /* 🛠️ ADMIN */
        .admin-panel {
            max-width: 950px;
            margin: 20px auto;
            background-color: var(--bg-card-dark);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .admin-form {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .admin-form input {
            flex: 1;
            background-color: var(--bg-input-dark);
            border: 1px solid var(--border-color);
            padding: 12px;
            color: white;
            border-radius: 6px;
        }

        .admin-form button {
            background-color: var(--text-main);
            color: black;
            border: none;
            padding: 0 20px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
        }

        /* 📸 PORTFÓLIO DE FOTOS */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            background-color: var(--bg-card-dark);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .gallery-item img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            display: block;
            transition: opacity 0.3s;
        }

        .gallery-item img:hover {
            opacity: 0.85;
        }

        .gallery-info {
            padding: 12px;
            font-size: 0.85rem;
            text-align: center;
            color: var(--text-muted);
        }

        /* 📅 BOXES DE CONTEÚDO */
        .booking-box, .forum-box, .location-box {
            background-color: var(--bg-card-dark);
            padding: 25px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .info-booking-text {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .form-group input, .form-group select, .comment-form input, .comment-form textarea {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-input-dark);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 6px;
        }

        .btn-submit {
            background-color: var(--accent-gold);
            color: black;
            border: none;
            width: 100%;
            padding: 14px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .success-message {
            margin-top: 15px;
            background-color: rgba(204, 164, 59, 0.08);
            color: var(--accent-gold);
            padding: 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            border: 1px solid var(--accent-gold);
        }

        /* 💬 MURAL DE FEEDBACKS */
        .comments-list {
            max-height: 220px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .comment-item {
            background-color: var(--bg-input-dark);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .comment-item strong {
            color: var(--accent-gold);
            font-size: 0.85rem;
            display: block;
            margin-bottom: 4px;
        }

        .comment-form textarea {
            height: 70px;
            resize: none;
            margin-bottom: 10px;
        }

        .comment-form button {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* 📍 SEÇÃO SEO LOCAL MAPS */
        .location-info h4 {
            color: var(--accent-silver);
            margin-bottom: 8px;
        }

        .location-info p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
        }
